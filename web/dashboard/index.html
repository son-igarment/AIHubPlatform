<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIHub Dashboard</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root { --bg:#0b1020; --card:#121831; --text:#e6ecff; --muted:#9bb0ff33; --accent:#6ea8fe; --ok:#4cc9f0; --warn:#ffd166; --err:#ff6b6b; }
      @media (prefers-color-scheme: light) { :root { --bg:#f6f8ff; --card:#ffffff; --text:#0b1020; --muted:#0b102011; --accent:#2563eb; --ok:#10b981; --warn:#f59e0b; --err:#ef4444; } }
      html,body { height:100%; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; background:linear-gradient(180deg, var(--bg), #0b1020) fixed; color:var(--text); }
      .container { max-width:1100px; margin:0 auto; padding:16px; }
      .header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .brand { font-weight:700; letter-spacing:0.2px; }
      .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0; }
      .card { background:linear-gradient(180deg, var(--card), #0b1020e6); border:1px solid var(--muted); border-radius:12px; padding:14px; box-shadow:0 8px 24px #00000022; }
      .card small { opacity:.8; }
      .card h2 { margin:.25rem 0 0; font-size:1.6rem; }
      .badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
      .badge { padding:2px 8px; border-radius:999px; font-size:.78rem; border:1px solid var(--muted); background:#ffffff08; }
      .chart-wrap { background:linear-gradient(180deg, var(--card), #0b1020e6); border:1px solid var(--muted); border-radius:12px; padding:12px; }
      .row { display:grid; grid-template-columns:2fr; gap:12px; }
      .footer { opacity:.7; font-size:.85rem; margin:16px 0; }
      .section { margin:24px 0; display:flex; flex-direction:column; gap:12px; }
      .section-title { display:flex; align-items:center; justify-content:space-between; font-size:1rem; font-weight:600; }
      .section-title small { font-weight:400; opacity:.7; }
      .insight-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
      .insight-item { display:flex; flex-direction:column; gap:8px; }
      .insight-label { font-size:.85rem; opacity:.75; padding:0 4px; }
      .module-card h2 { font-size:1.4rem; margin:.4rem 0 0; }
      .module-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
      .module-tag { padding:4px 10px; border-radius:999px; font-size:.75rem; border:1px solid var(--muted); background:#ffffff12; transition:all .2s ease; }
      .module-tag.on { color:var(--ok); border-color:var(--ok); background:rgba(16,185,129,0.08); }
      .module-tag.off { color:var(--err); border-color:var(--err); background:rgba(239,68,68,0.08); }
      .module-meta { margin-top:8px; font-size:.75rem; opacity:.7; }
      .chart-block { display:flex; flex-direction:column; gap:6px; }
      .heatmap-card { display:flex; flex-direction:column; gap:10px; }
      .heatmap-body { display:flex; gap:8px; align-items:stretch; }
      .heatmap-grid { flex:1; display:grid; gap:3px; min-height:220px; border:1px solid var(--muted); border-radius:8px; padding:6px; background:linear-gradient(180deg, var(--card), #0b1020c0); }
      .heatmap-cell { border-radius:4px; min-height:0; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--text); font-variant-numeric:tabular-nums; transition:background-color .25s ease; }
      .heatmap-axis-x { display:grid; gap:4px; font-size:.7rem; opacity:.75; margin-left:34px; padding-top:4px; }
      .heatmap-axis-y { width:28px; display:flex; flex-direction:column; justify-content:space-between; font-size:.7rem; opacity:.75; padding:6px 0; text-align:right; }
      .heatmap-legend { font-size:.75rem; opacity:.65; display:flex; gap:6px; align-items:center; padding:0 4px; }
      .heatmap-legend-bar { flex:1; height:6px; border-radius:999px; background:linear-gradient(90deg, rgba(110,168,254,0.12), rgba(110,168,254,0.9)); }
      @media (max-width: 900px) { .cards { grid-template-columns:repeat(2,1fr);} .insight-grid { grid-template-columns:1fr; } }
      @media (max-width: 560px) {
        .header { flex-direction:column; align-items:flex-start; }
        .cards { grid-template-columns:1fr; }
        .brand { font-size:1.1rem; }
      }
    </style>
    <!-- Libraries via CDN -->
    <script defer src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ensure this runs after DOM parsed and deferred libs loaded
      window.addEventListener('DOMContentLoaded', function(){
        const e = React.createElement;

        function fetchJSON(path) { return fetch(path, { cache:'no-store' }).then(r => r.json()); }

        const INSIGHT_BASE = Object.freeze({
          modules: [],
          modules_summary: { total: 0, enabled: 0, disabled: 0 },
          requests_per_minute: [],
          latency_per_minute: [],
          similarity_heatmap: [],
          updated_at: ''
        });

        function createInsightState(overrides = {}) {
          return {
            modules: [],
            modules_summary: { total: 0, enabled: 0, disabled: 0 },
            requests_per_minute: [],
            latency_per_minute: [],
            similarity_heatmap: [],
            updated_at: '',
            ...overrides,
            modules_summary: {
              ...INSIGHT_BASE.modules_summary,
              ...(overrides.modules_summary || {})
            }
          };
        }

        function mergeInsight(prev, next) {
          if (!next || typeof next !== 'object') {
            return prev;
          }
          return {
            ...prev,
            modules: next.modules ? [...next.modules] : prev.modules,
            modules_summary: next.modules_summary
              ? { ...next.modules_summary }
              : { ...prev.modules_summary },
            requests_per_minute: next.requests_per_minute
              ? [...next.requests_per_minute]
              : prev.requests_per_minute,
            latency_per_minute: next.latency_per_minute
              ? [...next.latency_per_minute]
              : prev.latency_per_minute,
            similarity_heatmap: next.similarity_heatmap
              ? [...next.similarity_heatmap]
              : prev.similarity_heatmap,
            updated_at: next.updated_at || prev.updated_at,
          };
        }

        function KpiCard({ title, value, badges }) {
          return e('div', { className:'card' },
            e('small', null, title),
            e('h2', null, String(value)),
            e('div', { className:'badges' }, (badges||[]).map((b, i) =>
              e('span', { key:i, className:'badge', style:{ borderColor:b.color, color:b.color } }, `${b.label}: ${b.value}`)
            ))
          );
        }

        function LineChart({ points, label='Metric', color, height=280 }) {
          const chartRef = React.useRef(null);
          const canvasRef = React.useRef(null);
          React.useEffect(() => {
            if (!canvasRef.current) return;
            const ctx = canvasRef.current.getContext('2d');
            const c = new Chart(ctx, {
              type: 'line',
              data: {
                labels: (points||[]).map(p => new Date(p.ts)),
                datasets: [{
                  label,
                  data: (points||[]).map(p => p.value),
                  borderColor: color || (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6ea8fe'),
                  backgroundColor: 'rgba(110,168,254,.15)',
                  tension: .3,
                  pointRadius: 0,
                  borderWidth: 2,
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 180 },
                scales: {
                  x: { display: false },
                  y: { display: true, grid: { color: 'rgba(150,160,200,.15)' } }
                },
                plugins: { legend: { display: false }, tooltip: { intersect:false, mode:'index' } }
              }
            });
            chartRef.current = c;
            return () => { try { c.destroy(); } catch{} };
          }, []);

          React.useEffect(() => {
            const c = chartRef.current; if (!c) return;
            const ds = c.data.datasets[0];
            const lastLen = c.data.labels.length;
            const newLen = (points||[]).length;
            if (newLen >= lastLen) {
              for (let i = lastLen; i < newLen; i++) {
                ds.data.push(points[i].value);
                c.data.labels.push(new Date(points[i].ts));
              }
              if (c.data.labels.length > 300) {
                c.data.labels = c.data.labels.slice(-300);
                ds.data = ds.data.slice(-300);
              }
            } else {
              ds.data = (points||[]).map(p => p.value);
              c.data.labels = (points||[]).map(p => new Date(p.ts));
            }
            c.update('none');
          }, [points]);

          return e('div', { className:'chart-wrap', style:{height: `${height}px`} }, e('canvas', { ref: canvasRef }));
        }

        function SimilarityHeatmap({ series }) {
          const data = Array.isArray(series) ? series : [];
          const columns = data.length;
          const binCount = columns ? (data[0].bins || []).length : 10;
          const maxVal = data.reduce((acc, col) => Math.max(acc, ...((col.bins || []))), 0);
          const gridColumns = Math.max(columns, 1);
          const gridRows = Math.max(binCount, 1);
          const cells = [];
          for (let row = gridRows - 1; row >= 0; row--) {
            for (let col = 0; col < gridColumns; col++) {
              const colBins = data[col]?.bins || [];
              const value = colBins[row] || 0;
              const ratio = maxVal ? value / maxVal : 0;
              const bg = `rgba(110,168,254,${0.12 + ratio * 0.78})`;
              const textColor = ratio > 0.6 ? '#0b1020' : 'var(--text)';
              cells.push(
                e('div', {
                  key: `cell-${row}-${col}`,
                  className: 'heatmap-cell',
                  style: { backgroundColor: bg, color: textColor }
                }, value ? e('span', null, value) : null)
              );
            }
          }
          const yTicks = ['1.0', '0.75', '0.5', '0.25', '0.0'];
          return e('div', { className: 'chart-wrap heatmap-card' },
            e('div', { className: 'heatmap-body' },
              e('div', { className: 'heatmap-axis-y' },
                yTicks.map((label, idx) => e('span', { key: `y-${idx}` }, label))
              ),
              e('div', {
                className: 'heatmap-grid',
                style: {
                  gridTemplateColumns: `repeat(${gridColumns}, minmax(0, 1fr))`,
                  gridTemplateRows: `repeat(${gridRows}, 1fr)`
                }
              }, cells)
            ),
            e('div', {
              className: 'heatmap-axis-x',
              style: { gridTemplateColumns: `repeat(${gridColumns}, minmax(0, 1fr))` }
            },
              data.map((col, idx) => e('span', { key: `x-${col.minute || idx}` }, (col.label || (col.minute ? col.minute.slice(11, 16) : `M${idx + 1}`))))
            ),
            e('div', { className: 'heatmap-legend' },
              e('span', null, 'Thấp'),
              e('div', { className: 'heatmap-legend-bar' }),
              e('span', null, 'Cao')
            )
          );
        }

        function ModuleStatusCard({ summary, modules, updatedAt }) {
          const items = Array.isArray(modules) ? modules : [];
          const enabled = summary?.enabled ?? items.filter(m => m.enabled).length;
          const total = summary?.total ?? items.length;
          const disabled = summary?.disabled ?? Math.max(0, total - enabled);
          const prettyTs = updatedAt ? (updatedAt.replace('T', ' ').slice(0, 19)) : '-';
          return e('div', { className: 'card module-card' },
            e('small', null, 'Trạng thái module'),
            e('h2', null, `${enabled}/${total} bật`),
            e('div', { className: 'module-grid' },
              items.map((mod, idx) =>
                e('span', {
                  key: `${mod.name || idx}`,
                  className: `module-tag ${mod.enabled ? 'on' : 'off'}`
                }, mod.name || `Module ${idx + 1}`)
              )
            ),
            e('div', { className: 'module-meta' }, `Tắt: ${disabled} | Cập nhật: ${prettyTs}`)
          );
        }

        function useDashboardData() {
          const [tasks, setTasks] = React.useState({ total:0, completed:0, pending:0, failed:0, updated_at: '' });
          const [reports, setReports] = React.useState({ total:0, delivered_today:0, pending_review:0, failed:0, updated_at: '' });
          const [points, setPoints] = React.useState([]);
          const [ai, setAI] = React.useState({ total_generations:0, avg_similarity:0, similarity_count:0, p50_latency_ms:0, p95_latency_ms:0, avg_latency_ms:0, updated_at:'' });
          const [aiLat, setAiLat] = React.useState([]);
          const [insight, setInsight] = React.useState(() => createInsightState());
          const [connected, setConnected] = React.useState(false);

          React.useEffect(() => {
            fetchJSON('/api/v1/tasks/summary').then(setTasks).catch(()=>{});
            fetchJSON('/api/v1/reports/summary').then(setReports).catch(()=>{});
            fetchJSON('/api/v1/metrics/history?limit=120').then(d => setPoints(d.points||[])).catch(()=>{});
            fetchJSON('/api/v1/ai/stats').then(setAI).catch(()=>{});
            fetchJSON('/api/v1/ai/history?limit=120').then(d => {
              const lat = (d.latencies||[]).map(p => ({ ts:p.ts, value:p.ms }));
              setAiLat(lat);
            }).catch(()=>{});
            fetchJSON('/api/v1/dashboard/insight').then(data => {
              setInsight(prev => mergeInsight(prev, data));
            }).catch(()=>{});
          }, []);

          React.useEffect(() => {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const url = proto + '://' + location.host + '/ws/metrics';
            let ws;
            try {
              ws = new WebSocket(url);
              ws.onopen = () => setConnected(true);
              ws.onclose = () => setConnected(false);
              ws.onerror = () => setConnected(false);
              ws.onmessage = (ev) => {
                try {
                  const msg = JSON.parse(ev.data);
                  if (msg.type === 'snapshot') {
                    if (Array.isArray(msg.points)) setPoints(msg.points);
                    if (msg.tasks) setTasks(msg.tasks);
                    if (msg.reports) setReports(msg.reports);
                    if (msg.ai) setAI(msg.ai);
                    if (msg.insight) setInsight(prev => mergeInsight(prev, msg.insight));
                  } else if (msg.type === 'metric') {
                    if (msg.point) setPoints(prev => prev.concat([msg.point]).slice(-300));
                    if (msg.tasks) setTasks(msg.tasks);
                    if (msg.reports) setReports(msg.reports);
                    if (msg.insight) setInsight(prev => mergeInsight(prev, msg.insight));
                  } else if (msg.type === 'ai_tick') {
                    if (msg.ai) setAI(msg.ai);
                    if (msg.latency) setAiLat(prev => prev.concat([{ ts: msg.latency.ts, value: msg.latency.ms }]).slice(-300));
                    if (msg.insight) setInsight(prev => mergeInsight(prev, msg.insight));
                  } else if (msg.type === 'ai_similarity') {
                    if (msg.ai) setAI(msg.ai);
                    if (msg.insight) setInsight(prev => mergeInsight(prev, msg.insight));
                  } else if (msg.type === 'insight') {
                    if (msg.insight) setInsight(prev => mergeInsight(prev, msg.insight));
                  }
                  try { ws.send('ok'); } catch {}
                } catch {}
              };
            } catch {}
            return () => { try { ws && ws.close(); } catch{} };
          }, []);

          return { tasks, reports, points, ai, aiLat, insight, connected };
        }

        function App() {
          const { tasks, reports, points, ai, aiLat, insight, connected } = useDashboardData();
          const requestPoints = (insight.requests_per_minute || []).map(p => ({ ts: p.minute, value: Number(p.count || 0) }));
          const latencyPoints = (insight.latency_per_minute || []).map(p => ({ ts: p.minute, value: Number(p.avg_latency_ms || 0) }));
          return e('div', { className:'container' },
            e('div', { className:'header' },
              e('div', { className:'brand' }, 'AIHub Mini Dashboard'),
              e('div', { className:'badge', title: connected ? 'WebSocket Connected' : 'Disconnected', style:{ borderColor: connected? 'var(--ok)': 'var(--warn)', color:connected? 'var(--ok)': 'var(--warn)'} }, connected ? 'Realtime: ON' : 'Realtime: OFF')
            ),
            e('div', { className:'cards' },
              e(KpiCard, { title:'Tasks', value: tasks.total, badges:[{label:'Done', value:tasks.completed, color:'var(--ok)'},{label:'Pending', value:tasks.pending, color:'var(--warn)'},{label:'Failed', value:tasks.failed, color:'var(--err)'}] }),
              e(KpiCard, { title:'Reports', value: reports.total, badges:[{label:'Today', value:reports.delivered_today, color:'var(--ok)'},{label:'Review', value:reports.pending_review, color:'var(--warn)'},{label:'Failed', value:reports.failed, color:'var(--err)'}] }),
              e(KpiCard, { title:'Updated', value: (tasks.updated_at||'').replace('T',' ').slice(0,19) || '-', badges:[] }),
              e(KpiCard, { title:'AI Gen', value: ai.total_generations, badges:[{label:'P50', value: ai.p50_latency_ms + 'ms', color:'var(--ok)'},{label:'P95', value: ai.p95_latency_ms + 'ms', color:'var(--warn)'},{label:'Avg', value: ai.avg_latency_ms + 'ms', color:'var(--accent)'}] })
            ),
            e('div', { className:'row' },
              e(LineChart, { points, label:'System Metric', color:'var(--accent)' })
            ),
            e('div', { className:'section' },
              e('div', { className:'section-title' },
                e('span', null, 'Insights realtime'),
                e('small', null, 'Requests/min · Latency · Similarity')
              ),
              e('div', { className:'insight-grid' },
                e('div', { className:'insight-item' },
                  e(ModuleStatusCard, { summary: insight.modules_summary, modules: insight.modules, updatedAt: insight.updated_at })
                ),
                e('div', { className:'insight-item' },
                  e('div', { className:'insight-label' }, 'Requests mỗi phút'),
                  e(LineChart, { points: requestPoints, label:'Requests/min', color:'var(--accent)', height:220 })
                ),
                e('div', { className:'insight-item' },
                  e('div', { className:'insight-label' }, 'Độ trễ trung bình (ms)'),
                  e(LineChart, { points: latencyPoints, label:'Avg latency (ms)', color:'var(--warn)', height:220 })
                ),
                e('div', { className:'insight-item' },
                  e('div', { className:'insight-label' }, 'Heatmap tương đồng'),
                  e(SimilarityHeatmap, { series: insight.similarity_heatmap })
                )
              )
            ),
            e('div', { className:'cards' },
              e(KpiCard, { title:'Độ tương đồng TB', value: (ai.avg_similarity||0).toFixed(3), badges:[{label:'Samples', value: ai.similarity_count, color:'var(--accent)'}] }),
              e(KpiCard, { title:'Latency', value: ai.avg_latency_ms + 'ms', badges:[{label:'P50', value: ai.p50_latency_ms + 'ms', color:'var(--ok)'},{label:'P95', value: ai.p95_latency_ms + 'ms', color:'var(--warn)'}] }),
              e(KpiCard, { title:'Cập nhật', value: (ai.updated_at||'').replace('T',' ').slice(0,19) || '-', badges:[] }),
              e(KpiCard, { title:'Users', value: 'Demo', badges:[{label:'Admin', value:'1', color:'var(--accent)'},{label:'Dev', value:'1', color:'var(--accent)'}] })
            ),
            e('div', { className:'row' },
              e(LineChart, { points: aiLat, label:'AI Latency (ms)', color:'var(--ok)' })
            ),
            e('div', { className:'footer' }, 'Tip: Mở trên mobile để kiểm tra responsive. Insight load <2.5s, realtime qua WebSocket, tương thích mobile.')
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
      });
    </script>
  </body>
  </html>
