<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Content Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
                400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                800: '#3730a3', 900: '#312e81'
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root { height: 100%; }
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,.2); border-radius: 4px; }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      function useLocalStorage(key, initialValue) {
        const [value, setValue] = useState(() => {
          try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : initialValue; } catch { return initialValue; }
        });
        useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }, [key, value]);
        return [value, setValue];
      }

      function classNames(...xs) { return xs.filter(Boolean).join(' '); }

      function History({ items, onPick, onClear }) {
        return (
          <div className="h-full flex flex-col">
            <div className="flex items-center justify-between mb-2">
              <h3 className="font-semibold text-sm">Lịch sử</h3>
              <button className="text-xs text-red-600 hover:underline" onClick={onClear}>Xóa</button>
            </div>
            <div className="flex-1 overflow-auto pr-1 scrollbar-thin">
              {items.length === 0 && <div className="text-xs text-gray-500">Chưa có prompt nào</div>}
              <ul className="space-y-2">
                {items.map((it, idx) => (
                  <li key={idx} className="group p-2 bg-white rounded-md shadow-sm border border-gray-100 hover:border-primary-200 cursor-pointer" onClick={() => onPick(it)}>
                    <div className="text-xs text-gray-400">{new Date(it.ts).toLocaleString()}</div>
                    <div className="text-sm line-clamp-2">{it.prompt}</div>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        );
      }

      function ResultPane({ english, vietnamese, loading, reqId, model }) {
        const [tab, setTab] = useState('vi');
        return (
          <div className="h-full flex flex-col">
            <div className="flex items-center justify-between">
              <div className="inline-flex rounded-md bg-gray-100 p-1">
                {['vi','en'].map(t => (
                  <button key={t} onClick={() => setTab(t)} className={classNames('px-3 py-1 text-sm rounded', tab===t? 'bg-white shadow font-medium':'text-gray-600 hover:text-gray-900')}>{t==='vi'?'Tiếng Việt':'English'}</button>
                ))}
              </div>
              <div className="text-xs text-gray-500">{model && <>Model: <span className="font-medium">{model}</span></>} {reqId && <span className="ml-2">ID: {reqId}</span>}</div>
            </div>
            <div className="mt-3 flex-1 overflow-auto bg-white rounded-lg border border-gray-200 p-4 whitespace-pre-wrap leading-relaxed scrollbar-thin">
              {loading && <div className="text-gray-400 text-sm">Đang tạo nội dung theo thời gian thực...</div>}
              {!loading && !english && !vietnamese && <div className="text-gray-400 text-sm">Nhập prompt và nhấn Tạo nội dung</div>}
              {tab==='vi' ? vietnamese : english}
            </div>
          </div>
        );
      }

      function App() {
        const [prompt, setPrompt] = useState("");
        const [english, setEnglish] = useState("");
        const [vietnamese, setVietnamese] = useState("");
        const [loading, setLoading] = useState(false);
        const [reqInfo, setReqInfo] = useState({ id: '', model: ''});
        const [history, setHistory] = useLocalStorage('ai_gen_history', []);

        const sourceRef = useRef(null);

        const startStream = () => {
          if (!prompt.trim()) return;
          // Save to history
          setHistory(h => [{ prompt, ts: Date.now() }, ...h].slice(0, 50));

          setEnglish(""); setVietnamese(""); setReqInfo({ id: '', model: ''});
          setLoading(true);

          // EventSource requires GET; we send prompt via query
          const url = `/api/v1/generate_ai_text_stream?` + new URLSearchParams({ prompt });
          const es = new EventSource(url);
          sourceRef.current = es;

          es.addEventListener('start', (ev) => {
            try { const data = JSON.parse(ev.data); setReqInfo({ id: data.request_id || '', model: data.model || '' }); } catch {}
          });
          es.addEventListener('delta', (ev) => {
            try {
              const data = JSON.parse(ev.data);
              if (data.lang === 'english') setEnglish(prev => prev + data.text);
              if (data.lang === 'vietnamese') setVietnamese(prev => prev + data.text);
            } catch {}
          });
          es.addEventListener('section_end', () => {});
          es.addEventListener('done', () => { setLoading(false); es.close(); sourceRef.current = null; });
          es.addEventListener('error', () => { setLoading(false); try { es.close(); } catch {} sourceRef.current = null; });
        };

        const abortStream = () => {
          try { sourceRef.current?.close(); } catch {}
          sourceRef.current = null;
          setLoading(false);
        };

        const quickCall = async () => {
          if (!prompt.trim()) return;
          setHistory(h => [{ prompt, ts: Date.now() }, ...h].slice(0, 50));
          setEnglish(""); setVietnamese(""); setReqInfo({ id: '', model: ''});
          setLoading(true);
          try {
            const res = await fetch('/api/v1/generate_ai_text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
            const data = await res.json();
            setEnglish(data.english || "");
            setVietnamese(data.vietnamese || "");
            setReqInfo({ id: data.request_id || '', model: data.model || ''});
          } catch(e) {
            console.error(e);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="h-full flex flex-col">
            <header className="border-b bg-white">
              <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="inline-flex h-8 w-8 items-center justify-center rounded-md bg-primary-600 text-white font-bold">AI</span>
                  <h1 className="text-lg font-semibold">AI Content Generator</h1>
                </div>
                <nav className="text-sm text-gray-600">
                  <a className="hover:text-gray-900" href="/dashboard/">Dashboard</a>
                  <span className="mx-2">·</span>
                  <a className="hover:text-gray-900" href="/ai/">Generator</a>
                </nav>
              </div>
            </header>
            <main className="flex-1 max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-12 gap-6">
              <aside className="col-span-3">
                <div className="bg-white border rounded-lg p-4 h-[72vh]">
                  <History items={history} onPick={(it)=> setPrompt(it.prompt)} onClear={()=> setHistory([])} />
                </div>
              </aside>
              <section className="col-span-9 flex flex-col gap-4">
                <div className="bg-white border rounded-lg p-4">
                  <label className="block text-sm font-medium mb-2">Prompt</label>
                  <textarea value={prompt} onChange={e=> setPrompt(e.target.value)} placeholder="Nhập yêu cầu nội dung (vi/en)" rows={4} className="w-full border rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-primary-500"></textarea>
                  <div className="flex items-center gap-3 mt-3">
                    <button onClick={startStream} disabled={loading} className="px-4 py-2 rounded-md bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-60">Tạo realtime (SSE)</button>
                    <button onClick={quickCall} disabled={loading} className="px-4 py-2 rounded-md bg-gray-800 text-white hover:bg-gray-900 disabled:opacity-60">Gọi nhanh (1 lần)</button>
                    <button onClick={abortStream} disabled={!loading} className="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700 disabled:opacity-60">Dừng</button>
                    <button onClick={()=>{ setPrompt(''); setEnglish(''); setVietnamese(''); setReqInfo({id:'',model:''}); }} className="px-4 py-2 rounded-md border">Xóa</button>
                  </div>
                </div>
                <div className="bg-white border rounded-lg p-4 h-[52vh]">
                  <ResultPane english={english} vietnamese={vietnamese} loading={loading} reqId={reqInfo.id} model={reqInfo.model} />
                </div>
              </section>
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
  </html>
